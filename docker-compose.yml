services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: competitor_scout
      POSTGRES_PASSWORD: competitor_scout
      POSTGRES_DB: competitor_scout
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U competitor_scout"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - competitor_scout_postgres:/var/lib/postgresql/data

  prestart:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://competitor_scout:competitor_scout@postgres:5432/competitor_scout
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend-api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://competitor_scout:competitor_scout@postgres:5432/competitor_scout
    command:
      - uvicorn
      - competitor_scout.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      prestart:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  scout-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://competitor_scout:competitor_scout@postgres:5432/competitor_scout
    command: ["competitor-scout-worker"]
    depends_on:
      prestart:
        condition: service_completed_successfully
      backend-api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  competitor_scout_postgres:
