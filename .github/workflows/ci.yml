name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.9
          enable-cache: true
      - name: Run pre-commit hooks
        run: uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: 8.30.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: competitor_scout
          POSTGRES_PASSWORD: competitor_scout
          POSTGRES_USER: competitor_scout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U competitor_scout -d competitor_scout"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CSRF_SECRET: ci-csrf-secret-at-least-32-bytes-long
      DATABASE_URL: postgresql+asyncpg://competitor_scout:competitor_scout@localhost:5432/competitor_scout
      ENVIRONMENT: test
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      OTARI_AI_TOKEN: dummy-never-live
      PUBLIC_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-at-least-32-bytes
      TEST_POSTGRES_ADMIN_DSN: postgresql://competitor_scout:competitor_scout@localhost:5432/postgres
      WEB_INTERNAL_API_URL: http://localhost:8000
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.10.9
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Check lint
        run: uv run ruff check src tests scripts
      - name: Check formatting
        run: uv run ruff format --check src tests scripts
      - name: Run tests
        run: uv run pytest
      - name: Check migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.11.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Check lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Build production bundle
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
